<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <filter id="roughen3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    text {
      font-family: 'Caveat', cursive, sans-serif;
      text-anchor: middle;
    }
    .title-main { font-size: 26px; font-weight: 700; fill: #1E293B; letter-spacing: 1px; }
    .subtitle-main { font-size: 16px; font-weight: 600; fill: #64748B; }
    .card-title { font-size: 19px; font-weight: 700; }
    .card-status { font-size: 14px; font-weight: 700; }
    .card-desc { font-size: 13px; font-weight: 600; fill: #475569; }
    .badge-text { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Background Whiteboard -->
  <rect width="1000" height="500" fill="#FFFFFF" />

  <!-- Header Title -->
  <text x="500" y="42" class="title-main">¿COMO ACCEDER Y USAR SIMANFOR?</text>
  <text x="500" y="68" class="subtitle-main">ARBOL DE DECISION SEGUN EL PERFIL TECNICO Y EL OBJETIVO DASOMETRICO</text>

  <!-- Top Decision Node: Pregunta inicial -->
  <g transform="translate(300, 95)">
    <path filter="url(#roughen3)" d="M 0 0 C 130 -3, 270 3, 400 0 C 403 25, 398 50, 400 70 C 270 73, 130 68, 0 70 C -3 50, 2 25, 0 0 Z" 
          fill="#F8FAFC" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="200" y="30" class="card-title" fill="#0F172A">¿CUAL ES TU NECESIDAD PRINCIPAL?</text>
    <text x="200" y="52" class="card-desc" fill="#64748B">ELIGE LA VIA DE ACCESO OPTIMA SEGUN TU FLUJO DE TRABAJO</text>
  </g>

  <!-- Connectors from Root to 3 pathways -->
  <path d="M 360 168 C 340 190, 220 195, 180 220" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M 500 168 L 500 220" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M 640 168 C 660 190, 780 195, 820 220" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" />

  <!-- ==================== 1. VIA WEB (PRINCIPAL) ==================== -->
  <g transform="translate(50, 225)">
    <path filter="url(#roughen3)" d="M 0 0 C 80 -3, 180 2, 260 0 C 263 70, 258 170, 260 235 C 180 238, 80 232, 0 235 C -3 170, 2 70, 0 0 Z" 
          fill="#F0FDF4" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Badge: Recomendada -->
    <rect x="55" y="16" width="150" height="24" rx="12" fill="#16A34A" />
    <text x="130" y="33" class="badge-text">VIA RECOMENDADA</text>

    <text x="130" y="66" class="card-title" fill="#15803D">PLATAFORMA WEB</text>
    <text x="130" y="86" class="card-status" fill="#16A34A">simanfor.es (100% OPERATIVA)</text>
    <line x1="25" y1="96" x2="235" y2="96" stroke="#BBF7D0" stroke-width="1.6" />

    <text x="130" y="120" class="card-desc">ACCESO LIBRE Y GRATUITO</text>
    <text x="130" y="138" class="card-desc">EN LA NUBE, SIN INSTALACION</text>
    <text x="130" y="156" class="card-desc">INTERFAZ GRAFICA INTUITIVA</text>
    <text x="130" y="174" class="card-desc">EXPORTACION DE SALIDAS EN EXCEL</text>

    <rect x="25" y="190" width="210" height="32" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2" />
    <text x="130" y="211" font-size="14px" font-weight="700" fill="#15803D">PARA EL 95% DE USUARIOS</text>
  </g>

  <!-- ==================== 2. VIA DOCKER (EN REVISION) ==================== -->
  <g transform="translate(370, 225)">
    <path filter="url(#roughen3)" d="M 0 0 C 80 3, 180 -2, 260 0 C 263 70, 258 170, 260 235 C 180 237, 80 233, 0 235 C -3 170, 3 70, 0 0 Z" 
          fill="#FFFBEB" stroke="#D97706" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Badge: Escalabilidad -->
    <rect x="55" y="16" width="150" height="24" rx="12" fill="#D97706" />
    <text x="130" y="33" class="badge-text">ESCALABILIDAD</text>

    <text x="130" y="66" class="card-title" fill="#B45309">CONTENEDOR DOCKER</text>
    <text x="130" y="86" class="card-status" fill="#D97706">SUSPENDIDO TEMPORALMENTE</text>
    <line x1="25" y1="96" x2="235" y2="96" stroke="#FDE68A" stroke-width="1.6" />

    <text x="130" y="120" class="card-desc">EJECUCION LOCAL SIN INTERNET</text>
    <text x="130" y="138" class="card-desc">ENTORNO AUTOCONTENIDO</text>
    <text x="130" y="156" class="card-desc">ACTUALMENTE EN REFACTORIZACION</text>
    <text x="130" y="174" class="card-desc">SE REACTIVARA PROXIMAMENTE</text>

    <rect x="25" y="190" width="210" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" />
    <text x="130" y="211" font-size="14px" font-weight="700" fill="#92400E">USAR PLATAFORMA WEB</text>
  </g>

  <!-- ==================== 3. VIA PYTHON / COLABORACION ==================== -->
  <g transform="translate(690, 225)">
    <path filter="url(#roughen3)" d="M 0 0 C 80 -2, 180 3, 260 0 C 263 70, 258 170, 260 235 C 180 238, 80 232, 0 235 C -2 170, 2 70, 0 0 Z" 
          fill="#EFF6FF" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Badge: Desarrolladores -->
    <rect x="45" y="16" width="170" height="24" rx="12" fill="#2563EB" />
    <text x="130" y="33" class="badge-text">DESARROLLADORES</text>

    <text x="130" y="66" class="card-title" fill="#1D4ED8">PYTHON Y SOPORTE</text>
    <text x="130" y="86" class="card-status" fill="#2563EB">ACCESO BAJO SOLICITUD</text>
    <line x1="25" y1="96" x2="235" y2="96" stroke="#BFDBFE" stroke-width="1.6" />

    <text x="130" y="120" class="card-desc">SIMULACIONES MASIVAS (IFN)</text>
    <text x="130" y="138" class="card-desc">ALTAS CAPACIDADES COMPUTO</text>
    <text x="130" y="156" class="card-desc">INTEGRACION DE NUEVOS MODELOS</text>
    <text x="130" y="174" class="card-desc">CANAL: simanfor.forest@uva.es</text>

    <rect x="25" y="190" width="210" height="32" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2" />
    <text x="130" y="211" font-size="14px" font-weight="700" fill="#1E40AF">INVESTIGADORES Y MODELIZADORES</text>
  </g>

</svg>
