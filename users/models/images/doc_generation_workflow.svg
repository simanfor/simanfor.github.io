<svg viewBox="0 0 950 650" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family:'Caveat',cursive;">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');</style>
    
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. MODEL CLASSES (BLUE) -->
  <g filter="url(#roughen)">
    <rect x="50" y="80" width="160" height="110" rx="10" fill="#2563EB1A" stroke="#2563EB" stroke-width="3"/>
    <path d="M70,110 L200,110" stroke="#2563EB" stroke-width="2"/>
    <path d="M70,135 L180,135" stroke="#2563EB" stroke-width="2"/>
    <path d="M70,160 L190,160" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="130" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB" transform="rotate(-1,130,60)">MODEL CLASSES (.PY)</text>
  <text x="130" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#2563EB" transform="rotate(1,130,215)">TREES &amp; STAND MODELS</text>

  <!-- 2. BIBTEX LIBRARY (GREEN) -->
  <g filter="url(#roughen)">
    <ellipse cx="130" cy="480" rx="70" ry="15" fill="#16A34A1A" stroke="#16A34A" stroke-width="3"/>
    <rect x="60" y="480" width="140" height="70" fill="#16A34A1A" stroke="none"/>
    <path d="M60,480 L60,550 A70,15 0 0,0 200,550 L200,480" fill="none" stroke="#16A34A" stroke-width="3"/>
  </g>
  <text x="130" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#16A34A" transform="rotate(-1.5,130,440)">BIBTEX DB</text>
  <text x="130" y="520" text-anchor="middle" font-size="16" font-weight="600" fill="#16A34A">REFERENCES.BIB</text>
  
  <!-- GENERATOR (ORANGE) -->
  <g filter="url(#roughen)">
    <rect x="350" y="280" width="220" height="120" rx="20" fill="#EA580C1A" stroke="#EA580C" stroke-width="3"/>
    <path d="M370,320 L550,320 M370,360 L550,360" stroke="#EA580C" stroke-width="2"/>
  </g>
  <text x="460" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#EA580C" transform="rotate(2,460,260)">GENERATOR SCRIPT</text>
  <text x="460" y="340" text-anchor="middle" font-size="18" font-weight="600" fill="#EA580C">GENERATE_MODEL_DOCS.PY</text>

  <!-- 3. BASE TEMPLATES (BLUE CYANish) -->
  <g filter="url(#roughen)">
    <rect x="400" y="80" width="120" height="110" fill="#0891B21A" stroke="#0891B2" stroke-width="3"/>
    <path d="M420,110 L500,110 M420,135 L480,135 M420,160 L490,160" stroke="#0891B2" stroke-width="2"/>
  </g>
  <text x="460" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#0891B2" transform="rotate(1,460,60)">TEMPLATES</text>
  <text x="460" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#0891B2">_TEMPLATE_MODEL.MD</text>

  <!-- 4. FINAL DOCS (RED) -->
  <g filter="url(#roughen)">
    <rect x="750" y="275" width="130" height="130" fill="#EF44441A" stroke="#EF4444" stroke-width="3"/>
    <path d="M770,305 L860,305 M770,330 L850,330 M770,355 L860,355 M770,380 L840,380" stroke="#EF4444" stroke-width="2"/>
  </g>
  <text x="815" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#EF4444" transform="rotate(-2,815,255)">USER DOCS</text>
  <text x="815" y="430" text-anchor="middle" font-size="16" font-weight="600" fill="#EF4444">MARKDOWN FILES</text>

  
  <!-- ARROW 1: MODELS -> GENERATOR -->
  <path d="M225,135 C280,140 330,220 370,265" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)" filter="url(#roughen)"/>
  <circle cx="310" cy="180" r="12" fill="white" stroke="#2563EB" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="310" y="180" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="290" y="150" font-size="15" font-weight="600" fill="#2563EB" transform="rotate(-5,290,150)">EXTRACT METADATA</text>

  <!-- ARROW 2: BIBTEX -> GENERATOR -->
  <path d="M220,500 C270,480 340,420 390,385" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow-green)" filter="url(#roughen)"/>
  <circle cx="305" cy="460" r="12" fill="white" stroke="#16A34A" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="305" y="460" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#16A34A">2</text>
  <text x="250" y="420" font-size="15" font-weight="600" fill="#16A34A" transform="rotate(-15,250,420)">PARSE CITATIONS</text>

  <!-- ARROW 3: TEMPLATES -> GENERATOR -->
  <path d="M460,230 L460,265" fill="none" stroke="#0891B2" stroke-width="3" marker-end="url(#arrow-blue)" filter="url(#roughen)"/>
  <circle cx="485" cy="245" r="12" fill="white" stroke="#0891B2" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="485" y="245" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#0891B2">3</text>
  
  <!-- ARROW 4: GENERATOR -> DOCS -->
  <path d="M585,340 C630,340 680,340 735,340" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#arrow-orange)" filter="url(#roughen)"/>
  <circle cx="660" cy="340" r="12" fill="white" stroke="#EA580C" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="660" y="340" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#EA580C">4</text>
  <text x="660" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#EA580C">RENDER OUTPUT</text>

</svg>
