<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family:'Caveat',cursive;">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');</style>
    
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- MODEL INFO (BLUE) -->
  <g filter="url(#roughen)">
    <rect x="50" y="200" width="180" height="120" rx="10" fill="#2563EB1A" stroke="#2563EB" stroke-width="3"/>
    <line x1="50" y1="230" x2="230" y2="230" stroke="#2563EB" stroke-width="3"/>
  </g>
  <text x="140" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB" transform="rotate(-1.5,140,180)">MODEL_INFO()</text>
  <text x="140" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#2563EB">PYTHON CLASS</text>
  <text x="65" y="260" font-size="16" fill="#2563EB">.CITATION</text>
  <text x="65" y="285" font-size="16" fill="#2563EB">.MODULE_CITATIONS</text>
  <text x="65" y="310" font-size="16" fill="#2563EB">.VERSION</text>

  <!-- BIBTEX (GREEN) -->
  <g filter="url(#roughen)">
    <ellipse cx="450" cy="220" rx="70" ry="15" fill="#16A34A1A" stroke="#16A34A" stroke-width="3"/>
    <rect x="380" y="220" width="140" height="90" fill="#16A34A1A" stroke="none"/>
    <path d="M380,220 L380,310 A70,15 0 0,0 520,310 L520,220" fill="none" stroke="#16A34A" stroke-width="3"/>
  </g>
  <text x="450" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#16A34A" transform="rotate(1,450,180)">BIBTEX DATABASE</text>
  <text x="450" y="265" text-anchor="middle" font-size="18" font-weight="600" fill="#16A34A">REFERENCES.BIB</text>

  <!-- DOCS & REPORTS (RED) -->
  <g filter="url(#roughen)">
    <rect x="700" y="110" width="140" height="150" fill="#EF44441A" stroke="#EF4444" stroke-width="3"/>
    <path d="M700,140 L840,140" stroke="#EF4444" stroke-width="2"/>
    
    <rect x="700" y="340" width="140" height="150" fill="#EF44441A" stroke="#EF4444" stroke-width="3"/>
    <path d="M700,370 L840,370" stroke="#EF4444" stroke-width="2"/>
  </g>
  <text x="770" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#EF4444" transform="rotate(-2,770,80)">USER DOCS (MD)</text>
  <text x="770" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#EF4444">MKDOCS</text>
  <text x="770" y="170" text-anchor="middle" font-size="15" fill="#EF4444">FULL APA</text>
  <text x="770" y="195" text-anchor="middle" font-size="15" fill="#EF4444">CITATIONS</text>
  
  <text x="770" y="450" text-anchor="middle" font-size="24" font-weight="700" fill="#EF4444" transform="rotate(2,770,450)">SIM. REPORTS</text>
  <text x="770" y="362" text-anchor="middle" font-size="18" font-weight="600" fill="#EF4444">EXCEL OUTPUT</text>
  <text x="770" y="400" text-anchor="middle" font-size="15" fill="#EF4444">VERSION TAGS</text>
  <text x="770" y="425" text-anchor="middle" font-size="15" fill="#EF4444">SHORT ALIASES</text>


  <!-- ARROW 1: MODEL TO BIBTEX -->
  <path d="M235,260 C280,250 330,265 370,265" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)" filter="url(#roughen)"/>
  
  <circle cx="305" cy="245" r="12" fill="white" stroke="#2563EB" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="305" y="245" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#2563EB">1</text>
  
  <text x="305" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB" transform="rotate(-1,305,225)">FETCH KEYS</text>

  <!-- ARROW 2: BIBTEX TO DOCS -->
  <path d="M530,240 C590,220 640,195 690,185" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow-green)" filter="url(#roughen)"/>
  
  <circle cx="615" cy="218" r="12" fill="white" stroke="#16A34A" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="615" y="218" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#16A34A">2</text>
  
  <text x="615" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#16A34A" transform="rotate(-15,615,195)">PARSE FULL DATA</text>

  <!-- ARROW 3: MODEL TO REPORTS -->
  <path d="M190,325 C250,420 500,450 690,420" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)" filter="url(#roughen)"/>
  
  <circle cx="450" cy="442" r="12" fill="white" stroke="#2563EB" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="450" y="442" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#2563EB">3</text>
  
  <text x="450" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB" transform="rotate(3,450,420)">STATIC METADATA (NO FULL PARSE)</text>
  
</svg>
