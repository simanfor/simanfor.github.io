<svg viewBox="0 0 960 570" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Caveat', cursive;">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');
      .title-text { font-weight: 700; font-size: 16px; }
      .desc-text { font-weight: 600; font-size: 12px; }
      .num-text { font-weight: 700; font-size: 14px; }
      .hub-title { font-weight: 700; font-size: 21px; fill: #2563EB; }
    </style>

    <!-- Hand-drawn distortion filter -->
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Marker Arrow definitions per color -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background Canvas Frame -->
  <rect x="15" y="15" width="930" height="540" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6" filter="url(#roughen)"/>

  <!-- CENTRAL HUB: SIMANFOR ECOSISTEMA CIENTÍFICO -->
  <g filter="url(#roughen)">
    <!-- Central Cloud/Hub shape -->
    <path d="M 405,245 Q 435,215 480,220 Q 525,210 555,240 Q 588,260 578,300 Q 588,340 550,360 Q 520,380 480,370 Q 430,380 400,350 Q 370,320 380,280 Z"
          fill="#2563EB14" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Laptop / Core Icon inside -->
    <rect x="452" y="252" width="56" height="34" rx="4" fill="#2563EB20" stroke="#2563EB" stroke-width="2.2"/>
    <path d="M 444,286 L 516,286" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <!-- Central Hub Text -->
  <text x="480" y="318" text-anchor="middle" class="hub-title" transform="rotate(-1, 480, 318)">PUBLICACIONES</text>
  <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#2563EB" transform="rotate(-1, 480, 340)">ECOSISTEMA SIMANFOR</text>


  <!-- 1. TOP-LEFT: ARQUITECTURA Y HERRAMIENTAS (#EF4444) -->
  <g filter="url(#roughen)">
    <rect x="35" y="35" width="330" height="155" rx="12" fill="#EF44440D" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cloud & Mobile Mini Icon -->
    <rect x="52" y="52" width="22" height="36" rx="3" fill="#EF444420" stroke="#EF4444" stroke-width="1.8"/>
    <circle cx="63" cy="80" r="2" fill="#EF4444"/>
    <path d="M 85,60 Q 98,48 112,56 Q 124,52 128,64 Q 116,76 85,71 Z" fill="#EF444415" stroke="#EF4444" stroke-width="1.8"/>
  </g>
  <text x="215" y="68" text-anchor="middle" class="title-text" fill="#EF4444" transform="rotate(-0.8, 215, 68)">1. ARQUITECTURA Y HERRAMIENTAS</text>
  <text x="200" y="100" text-anchor="middle" class="desc-text" fill="#475569">• PLATAFORMA CLOUD Y DSS</text>
  <text x="200" y="122" text-anchor="middle" class="desc-text" fill="#475569">• APPS DE CAMPO (SMARTELO, TREECOLLECT)</text>
  <text x="200" y="144" text-anchor="middle" class="desc-text" fill="#475569">• LINKED OPEN DATA Y FOREST EXPLORER</text>

  <!-- Connection Arrow 1 -->
  <path d="M 400,255 C 360,215 330,195 295,185" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-red)" filter="url(#roughen)"/>
  <!-- Step circle 1 -->
  <circle cx="345" cy="208" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="url(#roughen)"/>
  <text x="345" y="208" text-anchor="middle" dominant-baseline="central" class="num-text" fill="#EF4444">1</text>


  <!-- 2. TOP-RIGHT: MODELOS FORESTALES (#16A34A) -->
  <g filter="url(#roughen)">
    <rect x="595" y="35" width="330" height="155" rx="12" fill="#16A34A0D" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tree Mini Icon -->
    <path d="M 635,105 L 635,122 M 622,105 L 648,105 L 635,80 Z M 626,84 L 644,84 L 635,62 Z" fill="#16A34A20" stroke="#16A34A" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="775" y="68" text-anchor="middle" class="title-text" fill="#16A34A" transform="rotate(0.8, 775, 68)">2. MODELOS FORESTALES</text>
  <text x="775" y="100" text-anchor="middle" class="desc-text" fill="#475569">• CRECIMIENTO ÁRBOL INDIVIDUAL (IBERO)</text>
  <text x="775" y="122" text-anchor="middle" class="desc-text" fill="#475569">• MODELOS ALTURA-DIÁMETRO NACIONALES</text>
  <text x="775" y="144" text-anchor="middle" class="desc-text" fill="#475569">• PARAMETRIZACIÓN EN MASAS MIXTAS</text>

  <!-- Connection Arrow 2 -->
  <path d="M 560,255 C 600,215 630,195 665,185" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)" filter="url(#roughen)"/>
  <!-- Step circle 2 -->
  <circle cx="615" cy="208" r="11" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" filter="url(#roughen)"/>
  <text x="615" y="208" text-anchor="middle" dominant-baseline="central" class="num-text" fill="#16A34A">2</text>


  <!-- 3. BOTTOM-RIGHT: GESTIÓN FORESTAL Y ECOLOGÍA (#EA580C) -->
  <g filter="url(#roughen)">
    <rect x="595" y="375" width="330" height="155" rx="12" fill="#EA580C0D" stroke="#EA580C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ecosystem Mini Icon -->
    <circle cx="630" cy="412" r="12" fill="#EA580C20" stroke="#EA580C" stroke-width="1.8"/>
    <path d="M 622,438 Q 630,420 638,438" stroke="#EA580C" stroke-width="1.8" fill="none"/>
  </g>
  <text x="775" y="408" text-anchor="middle" class="title-text" fill="#EA580C" transform="rotate(-0.8, 775, 408)">3. GESTIÓN Y ECOLOGÍA</text>
  <text x="775" y="438" text-anchor="middle" class="desc-text" fill="#475569">• ESCENARIOS SELVÍCOLAS Y REBOLLARES</text>
  <text x="775" y="460" text-anchor="middle" class="desc-text" fill="#475569">• CAPTURA DE CARBONO Y BIOMASA</text>
  <text x="775" y="482" text-anchor="middle" class="desc-text" fill="#475569">• RECURSOS NO MADERABLES (HONGOS, PIÑÓN)</text>

  <!-- Connection Arrow 3 -->
  <path d="M 560,345 C 600,380 630,405 665,415" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)" filter="url(#roughen)"/>
  <!-- Step circle 3 -->
  <circle cx="615" cy="385" r="11" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" filter="url(#roughen)"/>
  <text x="615" y="385" text-anchor="middle" dominant-baseline="central" class="num-text" fill="#EA580C">3</text>


  <!-- 4. BOTTOM-LEFT: TRABAJOS ACADÉMICOS (#7C3AED) -->
  <g filter="url(#roughen)">
    <rect x="35" y="375" width="330" height="155" rx="12" fill="#7C3AED0D" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Graduation Cap Mini Icon -->
    <path d="M 55,408 L 72,400 L 89,408 L 72,416 Z" fill="#7C3AED25" stroke="#7C3AED" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 61,411 L 61,421 Q 72,427 83,421 L 83,411" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
    <path d="M 89,408 L 92,420" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="215" y="408" text-anchor="middle" class="title-text" fill="#7C3AED" transform="rotate(0.8, 215, 408)">4. TRABAJOS ACADÉMICOS</text>
  <text x="200" y="438" text-anchor="middle" class="desc-text" fill="#475569">• TESIS DOCTORALES (PHD THESES)</text>
  <text x="200" y="460" text-anchor="middle" class="desc-text" fill="#475569">• TRABAJOS FIN DE MÁSTER (TFM)</text>
  <text x="200" y="482" text-anchor="middle" class="desc-text" fill="#475569">• TRABAJOS FIN DE GRADO (TFG)</text>

  <!-- Connection Arrow 4 -->
  <path d="M 400,345 C 360,380 330,405 295,415" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-purple)" filter="url(#roughen)"/>
  <!-- Step circle 4 -->
  <circle cx="345" cy="385" r="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#roughen)"/>
  <text x="345" y="385" text-anchor="middle" dominant-baseline="central" class="num-text" fill="#7C3AED">4</text>

</svg>
