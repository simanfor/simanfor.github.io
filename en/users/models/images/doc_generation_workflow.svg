<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family:'Caveat',cursive;">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');</style>
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Entity 1: MODEL CLASSES (Indigo) -->
  <g filter="url(#roughen)">
    <rect x="40" y="40" width="200" height="90" rx="8" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 65 L 100 65 M 70 85 L 140 85 M 70 105 L 120 105" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="140" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#7C3AED" transform="rotate(-1,140,160)">MODEL CLASSES</text>
  <text x="140" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#7C3AED">(SRC/MODELS/TREES/*.PY)</text>

  <!-- Entity 2: REFERENCES.BIB (Green) -->
  <g filter="url(#roughen)">
    <rect x="40" y="210" width="200" height="90" rx="8" fill="#16A34A1A" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55 235 L 95 235 M 55 255 L 130 255 M 55 275 L 110 275" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="140" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#16A34A" transform="rotate(1,140,330)">REFERENCES.BIB</text>
  <text x="140" y="350" text-anchor="middle" font-size="14" font-weight="400" fill="#16A34A">(BIBTEX DATABASE)</text>

  <!-- Entity 3: TEMPLATES (Orange) -->
  <g filter="url(#roughen)">
    <rect x="40" y="380" width="200" height="90" rx="8" fill="#EA580C1A" stroke="#EA580C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 405 L 120 405 M 60 425 L 150 425 M 60 445 L 110 445" stroke="#EA580C" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="140" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#EA580C" transform="rotate(-1,140,500)">MARKDOWN TEMPLATES</text>
  <text x="140" y="520" text-anchor="middle" font-size="14" font-weight="400" fill="#EA580C">(_TEMPLATE_MODEL.MD / .EN.MD)</text>

  <!-- Entity 4: GENERATE_MODEL_DOCS.PY (Red) -->
  <g filter="url(#roughen)">
    <rect x="420" y="195" width="210" height="120" rx="10" fill="#EF44441A" stroke="#EF4444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="525" cy="245" r="24" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <path d="M 525 228 L 525 262 M 508 245 L 542 245" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="525" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#EF4444" transform="rotate(-1,525,345)">GENERATE_MODEL_DOCS.PY</text>
  <text x="525" y="365" text-anchor="middle" font-size="14" font-weight="400" fill="#EF4444">(PYTHON ENGINE)</text>

  <!-- Entity 5: USER MODEL CARDS (Blue) -->
  <g filter="url(#roughen)">
    <rect x="760" y="195" width="200" height="120" rx="8" fill="#2563EB1A" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 780 220 L 840 220 M 780 240 L 870 240 M 780 260 L 850 260 M 780 280 L 820 280" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="860" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB" transform="rotate(1,860,345)">USER MODEL CARDS</text>
  <text x="860" y="365" text-anchor="middle" font-size="14" font-weight="400" fill="#2563EB">(DOCS/USERS/MODELS/*.MD)</text>

  <!-- Step 1: Connection Indigo -> Red -->
  <path d="M 240 85 C 330 85 370 170 420 215" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)" filter="url(#roughen)"/>
  <circle cx="330" cy="140" r="13" fill="white" stroke="#7C3AED" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="330" y="140" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#7C3AED">1</text>
  <text x="330" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#7C3AED" transform="rotate(-2,330,115)">IMPORTS &amp; RUNS MODEL_INFO()</text>

  <!-- Step 2: Connection Green -> Red -->
  <path d="M 240 255 C 300 255 350 255 420 255" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" filter="url(#roughen)"/>
  <circle cx="330" cy="255" r="13" fill="white" stroke="#16A34A" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="330" y="255" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#16A34A">2</text>
  <text x="330" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#16A34A">PARSES CITATIONS &amp; DOIS</text>

  <!-- Step 3: Connection Orange -> Red -->
  <path d="M 240 425 C 330 425 370 340 420 295" fill="none" stroke="#EA580C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" filter="url(#roughen)"/>
  <circle cx="330" cy="370" r="13" fill="white" stroke="#EA580C" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="330" y="370" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#EA580C">3</text>
  <text x="330" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#EA580C" transform="rotate(2,330,395)">INJECTS SECTION STRUCTURE</text>

  <!-- Step 4: Connection Red -> Blue -->
  <path d="M 630 255 C 680 255 710 255 760 255" fill="none" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)" filter="url(#roughen)"/>
  <circle cx="695" cy="255" r="13" fill="white" stroke="#EF4444" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="695" y="255" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#EF4444">4</text>
  <text x="695" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#EF4444" transform="rotate(-1,695,230)">GENERATES ES &amp; EN CARDS</text>
</svg>
