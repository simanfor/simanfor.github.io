<svg viewBox="0 0 780 1020" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Caveat',cursive;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');
      .txt-title { font-size: 18px; font-weight: 700; }
      .txt-main { font-size: 16px; font-weight: 600; }
      .txt-sub { font-size: 14px; font-weight: 500; }
      .txt-badge { font-size: 15px; font-weight: 700; }
    </style>
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#DB2777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. HEADER -->
  <g id="header">
    <text x="390" y="32" text-anchor="middle" fill="#1E293B" class="txt-title" font-size="22">INDIVIDUAL-TREE MODEL CALCULATION FLOW</text>
  </g>

  <!-- 2. START NODE -->
  <g filter="url(#roughen)" id="start-node">
    <rect x="280" y="55" width="220" height="42" rx="21" fill="#2563EB15" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <text x="390" y="76" text-anchor="middle" dominant-baseline="central" fill="#2563EB" class="txt-main">START SIMULATION</text>

  <!-- ARROW 1: START -> READ INPUT -->
  <path d="M390,98 Q390,118 390,132" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arr-blue)" filter="url(#roughen)"/>
  <circle cx="415" cy="115" r="11" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#roughen)"/>
  <text x="415" y="115" text-anchor="middle" dominant-baseline="central" fill="#2563EB" class="txt-badge">1</text>

  <!-- 3. READ INPUT -->
  <g filter="url(#roughen)" id="read-input">
    <ellipse cx="390" cy="148" rx="85" ry="12" fill="#16A34A15" stroke="#16A34A" stroke-width="2.6"/>
    <path d="M305,148 L305,185 A85,12 0 0,0 475,185 L475,148" fill="#16A34A15" stroke="#16A34A" stroke-width="2.6"/>
    <ellipse cx="390" cy="185" rx="85" ry="12" fill="none" stroke="#16A34A" stroke-width="2.6"/>
  </g>
  <text x="390" y="167" text-anchor="middle" dominant-baseline="central" fill="#16A34A" class="txt-main">READ INPUT</text>

  <!-- ARROW 2: READ INPUT -> INITIALIZATION -->
  <path d="M390,198 Q390,212 390,225" fill="none" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arr-green)" filter="url(#roughen)"/>
  <circle cx="415" cy="212" r="11" fill="white" stroke="#16A34A" stroke-width="2" filter="url(#roughen)"/>
  <text x="415" y="212" text-anchor="middle" dominant-baseline="central" fill="#16A34A" class="txt-badge">2</text>

  <!-- 4. INITIALIZATION BOX -->
  <g filter="url(#roughen)" id="init-box">
    <rect x="250" y="230" width="280" height="115" rx="8" fill="#7C3AED10" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="270" y="266" width="240" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
    <rect x="270" y="304" width="240" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
  </g>
  <text x="390" y="250" text-anchor="middle" fill="#7C3AED" class="txt-title">INITIALIZATION</text>
  <text x="390" y="282" text-anchor="middle" dominant-baseline="central" fill="#4B5563" class="txt-sub">Tree metrics imputation</text>
  <text x="390" y="320" text-anchor="middle" dominant-baseline="central" fill="#4B5563" class="txt-sub">Plot metrics imputation</text>

  <!-- ARROW 3: INITIALIZATION -> SCENARIO -->
  <path d="M390,346 Q390,364 390,380" fill="none" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arr-purple)" filter="url(#roughen)"/>
  <circle cx="415" cy="363" r="11" fill="white" stroke="#7C3AED" stroke-width="2" filter="url(#roughen)"/>
  <text x="415" y="363" text-anchor="middle" dominant-baseline="central" fill="#7C3AED" class="txt-badge">3</text>

  <!-- 5. DECISION DIAMOND (READ SCENARIO) -->
  <g filter="url(#roughen)" id="decision-diamond">
    <path d="M390,385 L490,425 L390,465 L290,425 Z" fill="#EA580C15" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="390" y="417" text-anchor="middle" dominant-baseline="central" fill="#EA580C" class="txt-main">READ SCENARIO</text>
  <text x="390" y="435" text-anchor="middle" dominant-baseline="central" fill="#EA580C" class="txt-sub">(Next action?)</text>

  <!-- ================= LEFT BRANCH: PROJECTION ================= -->
  <!-- ARROW 4A: SCENARIO -> PROJECTION -->
  <path d="M290,425 C225,425 185,460 185,490" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arr-blue)" filter="url(#roughen)"/>
  <circle cx="225" cy="425" r="11" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#roughen)"/>
  <text x="225" y="425" text-anchor="middle" dominant-baseline="central" fill="#2563EB" class="txt-badge">4</text>
  <text x="180" y="468" text-anchor="middle" fill="#2563EB" class="txt-main">Apply projection</text>

  <!-- PROJECTION BOX -->
  <g filter="url(#roughen)" id="projection-box">
    <rect x="65" y="495" width="245" height="235" rx="8" fill="#2563EB10" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="80" y="530" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="80" y="565" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="80" y="600" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="80" y="635" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="80" y="670" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  </g>
  <text x="187" y="515" text-anchor="middle" fill="#2563EB" class="txt-title">PROJECTION</text>
  <text x="187" y="544" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Survival / Mortality</text>
  <text x="187" y="579" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Growth (dbh, height)</text>
  <text x="187" y="614" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Ingrowth</text>
  <text x="187" y="649" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Tree metrics update</text>
  <text x="187" y="684" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Plot metrics update</text>

  <!-- RETURN LOOP PROJECTION -> SCENARIO -->
  <path d="M187,731 C187,775 35,775 35,590 C35,425 205,410 285,420" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-blue)" filter="url(#roughen)"/>
  <circle cx="35" cy="590" r="11" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#roughen)"/>
  <text x="35" y="590" text-anchor="middle" dominant-baseline="central" fill="#2563EB" class="txt-badge">5</text>
  <text x="30" y="560" text-anchor="end" fill="#2563EB" class="txt-sub" transform="rotate(-90,30,560)">NEXT ACTION</text>

  <!-- ================= RIGHT BRANCH: HARVEST ================= -->
  <!-- ARROW 4B: SCENARIO -> HARVEST -->
  <path d="M490,425 C555,425 595,460 595,490" fill="none" stroke="#DB2777" stroke-width="2.8" marker-end="url(#arr-pink)" filter="url(#roughen)"/>
  <circle cx="555" cy="425" r="11" fill="white" stroke="#DB2777" stroke-width="2" filter="url(#roughen)"/>
  <text x="555" y="425" text-anchor="middle" dominant-baseline="central" fill="#DB2777" class="txt-badge">6</text>
  <text x="600" y="468" text-anchor="middle" fill="#DB2777" class="txt-main">Apply harvest</text>

  <!-- CAJA CORTAS -->
  <g filter="url(#roughen)" id="thinning-box">
    <rect x="470" y="495" width="245" height="170" rx="8" fill="#DB277710" stroke="#DB2777" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="485" y="530" width="215" height="30" rx="5" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.6"/>
    <rect x="485" y="570" width="215" height="30" rx="5" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.6"/>
    <rect x="485" y="610" width="215" height="30" rx="5" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.6"/>
  </g>
  <text x="592" y="515" text-anchor="middle" fill="#DB2777" class="txt-title">HARVEST / TREATMENTS</text>
  <text x="592" y="545" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Harvest / cutting execution</text>
  <text x="592" y="585" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Tree metrics update</text>
  <text x="592" y="625" text-anchor="middle" dominant-baseline="central" fill="#1E293B" class="txt-sub">Plot metrics update</text>

  <!-- RETURN LOOP CORTA -> SCENARIO -->
  <path d="M592,666 C592,725 745,725 745,550 C745,425 575,410 495,420" fill="none" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-pink)" filter="url(#roughen)"/>
  <circle cx="745" cy="550" r="11" fill="white" stroke="#DB2777" stroke-width="2" filter="url(#roughen)"/>
  <text x="745" y="550" text-anchor="middle" dominant-baseline="central" fill="#DB2777" class="txt-badge">7</text>
  <text x="750" y="520" text-anchor="start" fill="#DB2777" class="txt-sub" transform="rotate(90,750,520)">NEXT ACTION</text>

  <!-- ================= CENTRAL BRANCH: END ================= -->
  <!-- FLECHA 8: SCENARIO -> WRITE OUTPUT -->
  <path d="M390,465 Q390,640 390,795" fill="none" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arr-green)" filter="url(#roughen)"/>
  <circle cx="415" cy="620" r="11" fill="white" stroke="#16A34A" stroke-width="2" filter="url(#roughen)"/>
  <text x="415" y="620" text-anchor="middle" dominant-baseline="central" fill="#16A34A" class="txt-badge">8</text>
  <text x="365" y="620" text-anchor="middle" dominant-baseline="central" fill="#16A34A" class="txt-main" transform="rotate(-90,365,620)">No more actions</text>

  <!-- 6. WRITE OUTPUT -->
  <g filter="url(#roughen)" id="write-output">
    <ellipse cx="390" cy="815" rx="85" ry="12" fill="#16A34A15" stroke="#16A34A" stroke-width="2.6"/>
    <path d="M305,815 L305,849 A85,12 0 0,0 475,849 L475,815" fill="#16A34A15" stroke="#16A34A" stroke-width="2.6"/>
    <ellipse cx="390" cy="849" rx="85" ry="12" fill="none" stroke="#16A34A" stroke-width="2.6"/>
  </g>
  <text x="390" y="833" text-anchor="middle" dominant-baseline="central" fill="#16A34A" class="txt-main">WRITE OUTPUT</text>

  <!-- ARROW 9: WRITE OUTPUT -> END -->
  <path d="M390,862 Q390,890 390,910" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arr-blue)" filter="url(#roughen)"/>
  <circle cx="415" cy="886" r="11" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#roughen)"/>
  <text x="415" y="886" text-anchor="middle" dominant-baseline="central" fill="#2563EB" class="txt-badge">9</text>

  <!-- 7. END NODE -->
  <g filter="url(#roughen)" id="end-node">
    <rect x="280" y="915" width="220" height="42" rx="21" fill="#2563EB15" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <text x="390" y="936" text-anchor="middle" dominant-baseline="central" fill="#2563EB" class="txt-main">END SIMULATION</text>
</svg>
