<svg viewBox="0 0 950 500" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family:'Caveat',cursive;">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');</style>
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Entity 1: REFERENCES.BIB (Green) -->
  <g filter="url(#roughen)">
    <rect x="50" y="40" width="180" height="90" rx="8" fill="#16A34A1A" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 65 65 L 105 65 M 65 85 L 140 85 M 65 105 L 120 105" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="140" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#16A34A" transform="rotate(-1,140,160)">REFERENCES.BIB</text>
  <text x="140" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#16A34A">(BIBTEX DATABASE)</text>

  <!-- Entity 2: MODEL CLASS (Purple) -->
  <g filter="url(#roughen)">
    <rect x="50" y="320" width="180" height="90" rx="8" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 70 345 L 110 345 M 80 365 L 150 365 M 80 385 L 130 385" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="140" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#7C3AED" transform="rotate(1,140,440)">MODEL_INFO()</text>
  <text x="140" y="460" text-anchor="middle" font-size="14" font-weight="400" fill="#7C3AED">(PYTHON CLASS)</text>

  <!-- Entity 3: GENERATE_MODEL_DOCS.PY (Red) -->
  <g filter="url(#roughen)">
    <rect x="400" y="180" width="190" height="100" rx="10" fill="#EF44441A" stroke="#EF4444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="495" cy="230" r="22" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <path d="M 495 215 L 495 245 M 480 230 L 510 230" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="495" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#EF4444" transform="rotate(-1,495,310)">DOCS GENERATOR</text>
  <text x="495" y="330" text-anchor="middle" font-size="14" font-weight="400" fill="#EF4444">(PYTHON SCRIPT)</text>

  <!-- Entity 4: MODEL CARD .MD (Blue) -->
  <g filter="url(#roughen)">
    <rect x="730" y="180" width="170" height="100" rx="8" fill="#2563EB1A" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 750 205 L 810 205 M 750 225 L 840 225 M 750 245 L 820 245 M 750 265 L 790 265" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="815" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB" transform="rotate(1,815,310)">MODEL CARD (.MD)</text>
  <text x="815" y="330" text-anchor="middle" font-size="14" font-weight="400" fill="#2563EB">(DOCUMENTATION)</text>

  <!-- Step 1: Connection between Model_info and References.bib -->
  <path d="M 140 320 C 115 260 115 190 140 135" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" filter="url(#roughen)"/>
  <circle cx="108" cy="225" r="13" fill="white" stroke="#7C3AED" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="108" y="225" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#7C3AED">1</text>
  <text x="50" y="225" text-anchor="end" font-size="15" font-weight="600" fill="#7C3AED" transform="rotate(-2,50,225)">USES BIBTEX KEYS</text>

  <!-- Step 2: Connection between Model_info and Generator -->
  <path d="M 230 350 C 310 350 360 300 400 265" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" filter="url(#roughen)"/>
  <circle cx="310" cy="325" r="13" fill="white" stroke="#7C3AED" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="310" y="325" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#7C3AED">2</text>
  <text x="310" y="352" text-anchor="middle" font-size="15" font-weight="600" fill="#7C3AED" transform="rotate(1,310,352)">READS METADATA &amp; KEYS</text>

  <!-- Step 3: Connection between References.bib and Generator -->
  <path d="M 230 85 C 310 85 360 140 400 195" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" filter="url(#roughen)"/>
  <circle cx="310" cy="125" r="13" fill="white" stroke="#16A34A" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="310" y="125" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#16A34A">3</text>
  <text x="310" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#16A34A" transform="rotate(-1,310,102)">RESOLVES CITATIONS &amp; DOIS</text>

  <!-- Step 4: Connection between Generator and Model Card MD -->
  <path d="M 590 230 C 640 230 680 230 720 230" fill="none" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)" filter="url(#roughen)"/>
  <circle cx="655" cy="230" r="13" fill="white" stroke="#EF4444" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="655" y="230" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#EF4444">4</text>
  <text x="655" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#EF4444" transform="rotate(-1,655,205)">RENDERS CITATIONS &amp; BIBLIOGRAPHY</text>
</svg>
