<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family:'Caveat',cursive;">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');</style>
    
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#DB2777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Entidad 1: Local Workspace -->
  <g filter="url(#roughen)">
    <!-- Laptop -->
    <path d="M70,160 L130,160 L130,120 L70,120 Z" fill="#2563EB1A" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50,170 L150,170 L140,160 L60,160 Z" fill="#2563EB1A" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="100" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB" transform="rotate(-1.5,100,210)">DESARROLLO</text>
  <text x="100" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB" transform="rotate(1,100,235)">(TODAS LAS DOCS)</text>

  <!-- Entidad 2: Private Repo -->
  <g filter="url(#roughen)">
    <!-- Cilindro / Folder -->
    <path d="M330,120 C330,110 370,110 370,120 L370,170 C370,180 330,180 330,170 Z" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330,120 C330,130 370,130 370,120" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="350" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#7C3AED" transform="rotate(1,350,210)">REPO PRIVADO</text>
  <text x="350" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#7C3AED" transform="rotate(-1,350,235)">simanfor-dask/documentation</text>

  <!-- Entidad 3: GitHub Actions (Muro) -->
  <g filter="url(#roughen)">
    <!-- Rectángulo con bordes -->
    <path d="M570,110 L650,110 L650,180 L570,180 Z" fill="#DB27771A" stroke="#DB2777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M610,130 L610,160 M590,145 L630,145" fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="610" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#DB2777" transform="rotate(-1,610,210)">GITHUB ACTIONS</text>
  <text x="610" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#DB2777" transform="rotate(1,610,235)">"MURO DE SEGURIDAD"</text>

  <!-- Entidad 4: Public Web -->
  <g filter="url(#roughen)">
    <!-- Nube -->
    <path d="M840,150 C830,130 860,110 880,125 C895,110 920,130 910,150 C930,155 920,180 895,175 C880,190 850,180 840,165 C820,170 820,150 840,150 Z" fill="#16A34A1A" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="880" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#16A34A" transform="rotate(1.5,880,210)">WEB PÚBLICA</text>
  <text x="880" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#16A34A" transform="rotate(-1,880,235)">simanfor.github.io</text>

  <!-- Flechas y Numeración -->
  <!-- 1. PUSH -->
  <path d="M160,145 C210,135 270,135 315,145" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)" filter="url(#roughen)"/>
  <circle cx="237" cy="133" r="12" fill="white" stroke="#2563EB" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="237" y="133" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="237" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB" transform="rotate(-2,237,110)">PUSH MAIN</text>

  <!-- 2. ACTIVA WORKFLOW -->
  <path d="M390,145 C440,155 500,155 555,145" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)" filter="url(#roughen)"/>
  <circle cx="472" cy="158" r="12" fill="white" stroke="#7C3AED" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="472" y="158" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#7C3AED">2</text>
  <text x="472" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#7C3AED" transform="rotate(1,472,182)">ACTIVA DESPLIEGUE</text>

  <!-- 3. PURGA -->
  <path d="M610,105 C610,50 690,50 655,100" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#arrow-pink)" filter="url(#roughen)"/>
  <circle cx="650" cy="55" r="12" fill="white" stroke="#DB2777" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="650" y="55" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#DB2777">3</text>
  <text x="650" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#DB2777" transform="rotate(-1,650,32)">PURGA DOCS PRIVADAS</text>

  <!-- 4. PUBLICA -->
  <path d="M670,145 C720,135 770,135 815,145" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#arrow-pink)" filter="url(#roughen)"/>
  <circle cx="742" cy="133" r="12" fill="white" stroke="#DB2777" stroke-width="2.5" filter="url(#roughen)"/>
  <text x="742" y="133" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#DB2777">4</text>
  <text x="742" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#DB2777" transform="rotate(1.5,742,110)">PUBLICA SOLO USUARIOS</text>

</svg>
